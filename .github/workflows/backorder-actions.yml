name: Back-order actions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,mbstring
      - name: Test authenticated back-order actions
        run: php tests/backorder-actions.php
      - name: Prepare browser and verify CSS
        run: |
          npm ci --ignore-scripts
          npm run build:css
          git diff --exit-code -- style.min.css style.core.min.css
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test back-order actions on mobile and desktop
        run: node tests/backorder-actions-viewport.cjs
