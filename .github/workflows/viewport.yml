name: Responsive browser smoke

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Install browser test dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real browser layouts and actions against isolated SQLite data
        run: node tests/viewport-testmode.mjs
      - name: Test merged Settings and Notifications screens
        run: node tests/settings-viewport.cjs
      - name: Test back-order mobile workflow against isolated SQLite data
        run: node tests/back-orders-viewport.cjs
      - name: Test Stock All overview on phone widths
        run: node tests/stock-all-viewport.cjs
      - name: Test redesigned order detail screen
        run: node tests/order-detail-viewport.cjs
      - name: Test incoming supplier order editing
        run: node tests/supplier-edit-viewport.cjs
      - name: Test shared supplies cupboard workflow
        run: node tests/supply-cupboard-viewport.cjs
      - name: Test clickable product reports
        run: node tests/product-order-report-viewport.cjs
      - name: Test rebuilt products list
        run: node tests/products-viewport.cjs
