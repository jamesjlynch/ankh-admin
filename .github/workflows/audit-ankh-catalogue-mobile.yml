name: Audit ANKH mobile product experience
on:
  push:
    branches:
      - feature/ankh-customer-portal
    paths:
      - tests/ankh-live-mobile-product-qa.cjs
      - tests/ankh-live-account-mobile-qa.cjs
      - tests/ankh-order-match-mobile-qa.cjs
      - tests/customer-request-order-link.php
      - customer-portal/request-order-match.css
      - customer-portal/request-order-match-view.php
      - .github/workflows/audit-ankh-catalogue-mobile.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standalone browser test runner
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/ankh-mobile-audit" playwright@1.56.1
          "$RUNNER_TEMP/ankh-mobile-audit/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test real public ANKH catalogue at mobile viewport sizes
        env:
          ANKH_LIVE_CATALOGUE: https://order.ankhpeptides.com
          ANKH_QA_SCREENSHOTS: ankh-mobile-qa-screenshots
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/ankh-mobile-audit/node_modules" node tests/ankh-live-mobile-product-qa.cjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Render safe fictional staff matching fixture
        env:
          ANKH_MATCH_RENDER_FILE: ${{ runner.temp }}/ankh-staff-match-fictional.html
        run: |
          set -euo pipefail
          php tests/customer-request-order-link.php
      - name: Audit responsive staff order matching and confirmations
        env:
          ANKH_MATCH_RENDER_FILE: ${{ runner.temp }}/ankh-staff-match-fictional.html
          ANKH_QA_SCREENSHOTS: ankh-mobile-qa-screenshots
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/ankh-mobile-audit/node_modules" node tests/ankh-order-match-mobile-qa.cjs
      - name: Audit fictional mobile customer account, requests and orders
        env:
          ANKH_LIVE_CATALOGUE: https://order.ankhpeptides.com
          ANKH_QA_SCREENSHOTS: ankh-mobile-qa-screenshots
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/ankh-mobile-audit/node_modules" node tests/ankh-live-account-mobile-qa.cjs
      - name: Save mobile experience screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ankh-live-product-mobile-qa
          path: ankh-mobile-qa-screenshots/
          if-no-files-found: warn
          retention-days: 7
