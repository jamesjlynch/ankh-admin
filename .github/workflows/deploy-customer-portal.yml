name: Deploy protected customer portal
on:
  push:
    branches: [feature/ankh-customer-portal]
    paths:
      - 'customer-portal/**'
      - 'customer-catalogue.php'
      - 'scripts/publish-customer-portal.sh'
      - 'tests/customer-portal*'
      - 'tests/customer-fridge.php'
      - 'tests/customer-storefront-preview-http.py'
      - 'tests/customer-public-storefront-http.py'
      - 'tests/customer-shopping-ux.php'
      - 'tests/customer-product-variants.php'
      - 'tests/customer-guest-request-tracking.php'
      - 'tests/customer-collection.php'
      - 'tests/customer-account-features.php'
      - 'tests/customer-catalogue-visibility.php'
      - 'tests/customer-product-safety.php'
      - 'scripts/prepare-ankh-sds.py'
      - 'scripts/import-ankh-sds.php'
      - 'scripts/release-ankh-sds-drafts.php'
      - '.github/workflows/deploy-customer-portal.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ankh-protected-customer-portal
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl, mbstring, gd, fileinfo
      - name: Block release on customer privacy and interaction regressions
        run: |
          set -euo pipefail
          php -l customer-portal/storefront-preview.php
          php -l customer-portal/storefront.php
          php -l customer-portal/shop-home.php
          php -l customer-portal/my-fridge.php
          php -l customer-portal/fridge-view.php
          php -l customer-portal/contact-settings.php
          php -l customer-portal/request-confirmation.php
          php -l customer-portal/request-watch.php
          php -l customer-portal/request-list-view.php
          php -l customer-portal/watchlist-view.php
          php -l customer-portal/account-features.php
          php -l customer-portal/statement.php
          php -l customer-portal/lib.php
          php -l customer-portal/customer-experience.php
          php -l customer-catalogue.php
          node --check customer-portal/storefront.js
          node --check customer-portal/storefront-luxury.js
          php -l customer-portal/storefront-experience.php
          php -l customer-portal/storefront-design.php
          php -l customer-portal/storefront-card.php
          php -l customer-portal/storefront-commerce.php
          php -l customer-portal/storefront-staff.php
          php -l customer-portal/product-certificates.php
          php -l customer-portal/product-safety.php
          php -l customer-portal/product-safety-document.php
          php -l scripts/import-ankh-sds.php
          php -l scripts/release-ankh-sds-drafts.php
          php -l customer-portal/content-studio.php
          php -l customer-portal/cms-product-image.php
          node --check customer-portal/cms-editor.js
          php -l customer-portal/product-document.php
          php -l customer-portal/product-specification.php
          php -l customer-portal/shop-checkout.php
          php -l customer-portal/shop-demo.php
          node --check customer-portal/shop-demo.js
          node --check customer-portal/checkout.js
          node --check customer-portal/storefront-cart.js
          node tests/customer-cart-add-animation.cjs
          node --check customer-portal/account.js
          node --check customer-portal/sw.js
          python3 -m json.tool customer-portal/manifest.webmanifest >/dev/null
          php tests/customer-fridge.php
          php tests/customer-shopping-ux.php
          php tests/customer-product-variants.php
          php tests/customer-guest-request-tracking.php
          php tests/customer-collection.php
          php tests/customer-account-features.php
          php tests/customer-statement.php
          php tests/customer-announcements.php
          php tests/customer-portal.php
          php tests/customer-catalogue-visibility.php
          php tests/customer-portal-render.php
          for tab in home orders requests vault support account insights recurring notifications catalogue basket checkout test-orders; do php tests/customer-portal-navigation.php "$tab"; done
          python3 tests/customer-portal-catalogue-http.py
          python3 tests/customer-catalogue-admin-http.py
          python3 tests/customer-storefront-preview-http.py
          python3 tests/customer-public-storefront-http.py
          php tests/customer-product-certificates.php
          php tests/customer-product-safety.php
          php tests/customer-product-cms.php
          python3 tests/customer-cms-staff-http.py
          php tests/customer-storefront-commerce.php
          php tests/customer-demo-basket.php
      - name: Configure deployment access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KRYSTAL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KRYSTAL_KNOWN_HOSTS }}
          KRYSTAL_HOST: ${{ secrets.KRYSTAL_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$KRYSTAL_HOST"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -T 10 -p 722 -H "$KRYSTAL_HOST" > "$HOME/.ssh/known_hosts"
            test -s "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Test and publish only the customer portal
        env:
          KRYSTAL_HOST: ${{ secrets.KRYSTAL_HOST }}
          KRYSTAL_USER: ${{ secrets.KRYSTAL_USER }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_rsa" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p 722 "$KRYSTAL_USER@$KRYSTAL_HOST" "bash -se -- '$RELEASE_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          release_sha=$1
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          R=/home/devcouk/repositories/ankh-admin-git
          S=/home/devcouk/ankh-customer-portal-staging
          mkdir -p "$S"
          git -C "$R" fetch origin feature/ankh-customer-portal:refs/remotes/origin/feature/ankh-customer-portal
          git -C "$R" merge-base --is-ancestor "$release_sha" origin/feature/ankh-customer-portal
          git -C "$R" archive "$release_sha" customer-catalogue.php customer-portal scripts/configure-customer-preview.php scripts/customer-portal-accounts.php scripts/publish-customer-portal.sh scripts/check-public-catalogue.php scripts/import-ankh-sds.php scripts/release-ankh-sds-drafts.php tests/customer-fridge.php tests/customer-shopping-ux.php tests/customer-product-variants.php tests/customer-guest-request-tracking.php tests/customer-collection.php tests/customer-account-features.php tests/customer-statement.php tests/customer-announcements.php tests/customer-portal.php tests/customer-portal-render.php tests/customer-portal-navigation.php tests/customer-portal-catalogue.php tests/customer-catalogue-visibility.php tests/customer-product-safety.php | tar -x -C "$S"
          ANKH_PORTAL_CONFIG=/home/devcouk/ankh-customer-portal-config.php ANKH_CUSTOMER_PORTAL_ROOT=/home/devcouk/public_html/ankh-order bash "$S/scripts/publish-customer-portal.sh"
          ANKH_PORTAL_CONFIG=/home/devcouk/ankh-customer-portal-config.php php "$S/scripts/check-public-catalogue.php"
          REMOTE

      - name: Prepare fourteen private SDS draft files from existing CI artifact
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-ankh-sds]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pymupdf>=1.24,<1.28' 'pillow>=10,<12' 'numpy>=1.26,<3'
          mkdir -p sds-source
          gh run download 40102041108 --repo "$GITHUB_REPOSITORY" --name ANKH-SDS-REBRAND-DRAFT-20261024 --dir sds-source
          python3 scripts/prepare-ankh-sds.py
          test "$(find sds-ready -maxdepth 1 -name 'ANKH-SDS-*.pdf' -type f | wc -l)" -eq 14

      - name: Attach ANKH SDS batch privately to matched live CMS products
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-ankh-sds]') }}
        env:
          KRYSTAL_HOST: ${{ secrets.KRYSTAL_HOST }}
          KRYSTAL_USER: ${{ secrets.KRYSTAL_USER }}
        run: |
          set -euo pipefail
          remote="/home/devcouk/ankh-sds-stage-$GITHUB_SHA"
          ssh -i "$HOME/.ssh/id_rsa" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p 722 "$KRYSTAL_USER@$KRYSTAL_HOST" "install -d -m 700 '$remote'"
          scp -i "$HOME/.ssh/id_rsa" -P 722 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes sds-ready/ANKH-SDS-*.pdf "$KRYSTAL_USER@$KRYSTAL_HOST:$remote/"
          ssh -i "$HOME/.ssh/id_rsa" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p 722 "$KRYSTAL_USER@$KRYSTAL_HOST" "bash -se -- '$remote'" <<'REMOTE'
          set -Eeuo pipefail
          folder="$1"
          chmod 600 "$folder"/*.pdf
          ANKH_PORTAL_CONFIG=/home/devcouk/ankh-customer-portal-config.php php /home/devcouk/ankh-customer-portal-staging/scripts/import-ankh-sds.php "$folder"
          rm -rf -- "$folder"
          REMOTE

      - name: Release fourteen explicitly unverified SDS draft references
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-ankh-sds-drafts]') }}
        env:
          KRYSTAL_HOST: ${{ secrets.KRYSTAL_HOST }}
          KRYSTAL_USER: ${{ secrets.KRYSTAL_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_rsa" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p 722 "$KRYSTAL_USER@$KRYSTAL_HOST" \
            'ANKH_PORTAL_CONFIG=/home/devcouk/ankh-customer-portal-config.php php /home/devcouk/ankh-customer-portal-staging/scripts/release-ankh-sds-drafts.php'

      - name: Verify all fourteen SDS draft links on public ANKH product pages
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-ankh-sds-drafts]') }}
        run: |
          set -euo pipefail
          for product_id in 101 97 108 110 104 75 72 78 55 94 95 53 96 60; do
            html="$(curl --fail --location --retry 2 --max-time 22 --silent --show-error \
              -H 'Cache-Control: no-cache' "https://order.ankhpeptides.com/?product=$product_id")"
            grep -Fq 'Draft SDS reference' <<<"$html" || {
              echo "SDS draft card missing from public product $product_id"
              exit 1
            }
            grep -Fq 'not a technically approved Safety Data Sheet' <<<"$html" || {
              echo "Mandatory draft disclaimer missing from product $product_id"
              exit 1
            }
            echo "PUBLIC-DRAFT-CARD-VERIFIED product_id=$product_id"
          done
          hidden="$(curl --fail --max-time 22 --silent --show-error 'https://order.ankhpeptides.com/?product=73')"
          if grep -Fq 'Draft SDS reference' <<<"$hidden"; then
            echo 'Unexpected SDS draft published to unmatched BPC-157 10mg'
            exit 1
          fi
          echo 'SUCCESS: 14 public unverified SDS cards visible; unmatched product remains without SDS.'
