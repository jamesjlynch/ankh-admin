name: Customer catalogue visibility
on:
  push:
    branches: [main]
    paths: ['index.php', 'customer-catalogue.php', 'catalogue-admin.js', 'tests/customer-catalogue*', '.github/workflows/customer-catalogue-visibility.yml']
  pull_request:
    branches: [main]
    paths: ['index.php', 'customer-catalogue.php', 'catalogue-admin.js', 'tests/customer-catalogue*', '.github/workflows/customer-catalogue-visibility.yml']
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: pdo_sqlite, curl
      - run: |
          php -l index.php
          php -l customer-catalogue.php
          node --check catalogue-admin.js
          php tests/customer-catalogue-visibility.php
          python3 tests/customer-catalogue-admin-http.py
