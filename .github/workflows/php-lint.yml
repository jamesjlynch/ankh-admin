name: PHP lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Lint PHP
        run: |
          php -l index.php
          php -l setup.php
          php -l tests/future-delivery.php
      - name: Test future delivery scheduling
        run: php tests/future-delivery.php
