name: PHP lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify generated CSS assets
        run: |
          npm ci --ignore-scripts
          npm run build:css
          git diff --exit-code -- index.php style.min.css style.core.min.css
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - name: Lint PHP
        run: |
          php -l index.php
          php -l setup.php
          php -l tests/future-delivery.php
          php -l tests/stock-shortfall.php
          php -l supplier-centre.php
          php -l tests/supplier-centre.php
          php -l tests/supplier-purchase.php
          php -l tests/supplier-discount-purchase.php
          php -l tests/supplier-draft.php
          php -l tests/smart-buying.php
          php -l tests/smart-buying-apply.php
          php -l tests/supplier-flat-shipping.php
          php -l tests/supplier-basket-profit.php
          php -l tests/supplier-mobile-ux.php
          php -l tests/supplier-stock-circles.php
          php -l tests/deploy-smoke.php
          php -l tests/supplier-mobile-catalogue.php
          php -l tests/incoming-product-breakdown.php
          php -l tests/mobile-app-ux.php
          php -l tests/mobile-incoming-ux.php
          php -l tests/css-assets.php
      - name: Verify public compiled CSS fallback
        run: php tests/css-assets.php
      - name: Test future delivery scheduling
        run: php tests/future-delivery.php
      - name: Test fridge stock shortages
        run: php tests/stock-shortfall.php
      - name: Test supplier centre
        run: php tests/supplier-centre.php
      - name: Test supplier purchase into incoming stock
        run: php tests/supplier-purchase.php
      - name: Test supplier discount in a recorded incoming purchase
        run: php tests/supplier-discount-purchase.php
      - name: Test shared supplier basket draft
        run: php tests/supplier-draft.php
      - name: Test Smart Buying demand and budget UI
        run: php tests/smart-buying.php
      - name: Test safe merge of suggested boxes into shared basket
        run: php tests/smart-buying-apply.php
      - name: Test fixed USD order shipping and gross profit models
        run: php tests/supplier-flat-shipping.php
      - name: Test mobile supplier grouping, filtering and purchase priority
        run: php tests/supplier-mobile-catalogue.php
      - name: Test iPhone supplier purchasing, category and compact layout
        run: php tests/supplier-mobile-ux.php
      - name: Test combined available-vial stock circles
        run: php tests/supplier-stock-circles.php
      - name: Test projected supplier basket gross profit including shipping
        run: php tests/supplier-basket-profit.php
      - name: Test outstanding supplier quantities by incoming product
        run: php tests/incoming-product-breakdown.php
      - name: Verify mobile fast actions and compact navigation
        run: php tests/mobile-app-ux.php
      - name: Validate Stage 2 mobile Incoming Stock disclosures
        run: php tests/mobile-incoming-ux.php
      - name: Check deploy includes required PHP modules
        run: php tests/deploy-smoke.php
