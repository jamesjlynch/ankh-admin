name: Deploy ANKH Admin to new Krystal server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ankh-admin-new-krystal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,mbstring
      - name: Validate category controls before publishing
        run: |
          set -euo pipefail
          php -l index.php
          php -l catalogue-categories.php
          php tests/catalogue-categories.php
          php -l lab-accessory-drafts.php
          php -l scripts/seed-lab-accessories.php
          php tests/lab-accessory-drafts.php
          php -l lab-accessory-pricing.php
          php tests/lab-accessory-pricing.php 
          php -l lab-accessory-editorial.php
          php -l lab-accessory-editorial-update.php
          php -l scripts/upgrade-lab-accessory-editorial.php
          php tests/lab-accessory-editorial.php
          php -l lab-accessory-publish.php
          php -l scripts/publish-lab-accessory-profiles.php
          php tests/lab-accessory-publish.php
          php tests/customer-catalogue-visibility.php
          php -l customer-cms.php
          php -l product-v2.php
          php -l public-catalogue.php
          php tests/customer-cms.php
          php tests/public-catalogue.php
          php tests/delivery-queue.php
          php tests/business-alerts.php
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KRYSTAL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KRYSTAL_KNOWN_HOSTS }}
          KRYSTAL_HOST: ${{ secrets.KRYSTAL_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$KRYSTAL_HOST"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            # Temporary trust-on-first-use for migration testing; pin verified keys in KRYSTAL_KNOWN_HOSTS afterwards.
            ssh-keyscan -T 10 -p 722 -H "$KRYSTAL_HOST" > "$HOME/.ssh/known_hosts"
            test -s "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy to destination cPanel account
        env:
          KRYSTAL_HOST: ${{ secrets.KRYSTAL_HOST }}
          KRYSTAL_USER: ${{ secrets.KRYSTAL_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_rsa" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p 722 "$KRYSTAL_USER@$KRYSTAL_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/devcouk/repositories/ankh-admin-git
          git fetch origin main
          test "$(git branch --show-current)" = main
          test -z "$(git status --porcelain)"
          git merge --ff-only origin/main
          /opt/cpanel/ea-php82/root/usr/bin/php -r 'echo "Server SQLite version: ".(new PDO("sqlite::memory:"))->query("select sqlite_version()")->fetchColumn()." / SQLite3 backup available: ".(class_exists("SQLite3")&&method_exists("SQLite3","backup")?"yes":"no").PHP_EOL;'
          if ANKH_DEPLOY_HOME=/home/devcouk /bin/bash scripts/publish-live.sh; then
            echo "Verified ANKH Admin publisher returned success."
          else
            echo "Publisher failed; last diagnostics follow."
            tail -n 24 /home/devcouk/ankh-admin-deploy.log
            exit 1
          fi
          tail -n 12 /home/devcouk/ankh-admin-deploy.log
          /opt/cpanel/ea-php82/root/usr/bin/php -r '
            $config=require "/home/devcouk/ankh-admin-config.php";
            $db=new PDO("sqlite:".$config["database_path"]);
            $count=(int)$db->query("SELECT COUNT(*) FROM lab_accessory_sourcing s JOIN products p ON p.id=s.product_id JOIN customer_catalogue_visibility v ON v.product_id=p.id WHERE p.active=1 AND v.visible=1 AND s.price_status IN (\x27reference_unconfirmed\x27,\x27needs_amazon_price\x27)")->fetchColumn();
            echo "Verified published lab supply information pages: ".$count."/12; all remain sourcing-pending.".PHP_EOL;
            if($count!==12)exit(1);
          '
          REMOTE
