name: Audit ANKH SDS reviewed release state
on:
  push:
    branches: [feature/ankh-customer-portal]
    paths:
      - '.github/workflows/audit-ankh-sds-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live SDS database status without modifying any records
        env:
          KRYSTAL_HOST: ${{ secrets.KRYSTAL_HOST }}
          KRYSTAL_USER: ${{ secrets.KRYSTAL_USER }}
          KRYSTAL_SSH_PRIVATE_KEY: ${{ secrets.KRYSTAL_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.ssh"; chmod 700 "$HOME/.ssh"
          printf '%s\n' "$KRYSTAL_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          ssh-keyscan -p 722 -T 7 "$KRYSTAL_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/id_rsa" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p 722 "$KRYSTAL_USER@$KRYSTAL_HOST" "php -r ' \
            \$cfg=require \"/home/devcouk/ankh-customer-portal-config.php\"; \
            \$pdo=new PDO(\"sqlite:\".\$cfg[\"portal_database_path\"]); \
            \$pdo->exec(\"PRAGMA query_only=ON\"); \
            foreach(\$pdo->query(\"SELECT id,product_id,published,public_draft,reviewed_at FROM portal_product_sds ORDER BY id\") as \$r) \
              echo \"SDS-DB id=\".\$r[0].\" product=\".\$r[1].\" published=\".\$r[2].\" draft=\".\$r[3].\" reviewed=\".(\$r[4]>0?1:0).PHP_EOL; \
          '"
      - name: Publicly verify expected reviewed SDS cards and headers
        run: |
          set -euo pipefail
          count=0
          for product_id in 101 97 108 110 104 75 72 78 55 94 95 53 96 60; do
            html="$(curl --fail --location --max-time 20 --silent --show-error "https://order.ankhpeptides.com/?product=$product_id")"
            if grep -Fq 'ANKH reviewed SDS' <<<"$html" && [[ "$html" =~ product-safety-document\.php\?id=([0-9]+) ]]; then
              id="${BASH_REMATCH[1]}"
              headers="$(curl --fail --silent --show-error --max-time 20 -D - -o /dev/null "https://order.ankhpeptides.com/product-safety-document.php?id=$id")"
              if grep -iq '^x-ankh-document-status: reviewed-sds' <<<"$headers"; then
                echo "LIVE-REVIEWED product=$product_id doc=$id"
                count=$((count+1))
              else
                echo "NOT-REVIEWED-HEADER product=$product_id doc=$id"
              fi
            else
              echo "NOT-REVIEWED-PAGE product=$product_id"
            fi
          done
          echo "REVIEWED-LIVE-COUNT=$count of 14"
