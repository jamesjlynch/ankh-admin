name: Clear customer catalogue selections
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reset-catalogue-selections.yml']
permissions:
  contents: read
concurrency:
  group: ankh-catalogue-selection-reset
  cancel-in-progress: false
jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure deployment access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KRYSTAL_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KRYSTAL_KNOWN_HOSTS }}
          KRYSTAL_HOST: ${{ secrets.KRYSTAL_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$KRYSTAL_HOST"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -T 10 -p 722 -H "$KRYSTAL_HOST" > "$HOME/.ssh/known_hosts"
            test -s "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Clear saved visibility once for this user request
        env:
          KRYSTAL_HOST: ${{ secrets.KRYSTAL_HOST }}
          KRYSTAL_USER: ${{ secrets.KRYSTAL_USER }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh -i "$HOME/.ssh/id_rsa" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -p 722 "$KRYSTAL_USER@$KRYSTAL_HOST" "bash -se -- $GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          release="$1"
          R=/home/devcouk/repositories/ankh-admin-git
          git -C "$R" fetch origin main
          task_file="$(mktemp /home/devcouk/.ankh-catalogue-reset.XXXXXX)"
          trap 'rm -f -- "$task_file"' EXIT
          git -C "$R" show "$release:scripts/reset-catalogue-visibility.php" > "$task_file"
          php -l "$task_file"
          ANKH_ADMIN_CONFIG=/home/devcouk/ankh-admin-config.php php "$task_file" visibility-reset-20261022-01
          REMOTE
