name: Packing Centre
on:
  workflow_call:
  pull_request:
    branches: [main]
jobs:
  packing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite,mbstring
      - name: Verify saved runs and isolation
        run: php tests/packing-centre.php
      - name: Prepare browsers
        run: |
          npm ci --ignore-scripts
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test full mobile and print workflow
        run: node tests/packing-centre-viewport.cjs
      - name: Test Safari engine
        run: ANKH_TEST_BROWSER=webkit node tests/packing-centre-viewport.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packing-print-checks
          path: |
            /tmp/ankh-packing-*.png
            /tmp/ankh-packing-*.pdf
